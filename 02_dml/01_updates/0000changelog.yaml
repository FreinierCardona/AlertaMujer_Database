databaseChangeLog:
  - changeSet:
      id: AM-BD-026-02-update-evidence-metadata-size-configuration
      author: FreinierCardona
      labels: "hu-db-026,dml,configuration,evidence"
      comment: Publishes the 500000-byte WebP evidence limit to the application configuration.
      changes:
        - sqlFile:
            path: 001_reduce_evidence_metadata_size_limit.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/02_dml/01_updates/001_reduce_evidence_metadata_size_limit.rollback.sql
            relativeToChangelogFile: true
            stripComments: false
  - changeSet:
      id: AM-BD-030-02-allow-unbounded-automatic-evidence-count
      author: FreinierCardona
      labels: "hu-db-030,dml,configuration,evidence"
      comment: Disables the application evidence-count cap for periodic capture.
      changes:
        - sqlFile:
            path: 002_allow_unbounded_automatic_evidence_count.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/02_dml/01_updates/002_allow_unbounded_automatic_evidence_count.rollback.sql
            relativeToChangelogFile: true
            stripComments: false
