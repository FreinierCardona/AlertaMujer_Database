      author: FreinierCardona
      labels: "hu-db-013,ddl,identity,security,function"
      comment: Exposes a refresh-token hash only by session identifier, without table-level secret reads.
      changes:
        - sqlFile:
            path: 002_create_user_session_refresh_token_hash_read_function.sql
