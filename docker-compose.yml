name: ${COMPOSE_PROJECT_NAME:-alertamujer-db}

# =============================================================================
# BASE DE DATOS ÚNICA DE ALERTAMUJER
#
# Uso:
#   docker compose up postgres -d
#
# Liquibase se integrará en la siguiente etapa como herramienta de versionado;
# este archivo no ejecuta migraciones ni crea tablas de negocio.
# =============================================================================

services:
  postgres:
    image: postgres:17.11-alpine3.24
    container_name: alertamujer_db
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["postgres", "-p", "${POSTGRES_CONTAINER_PORT:?POSTGRES_CONTAINER_PORT is required in .env}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_CONTAINER_PORT: ${POSTGRES_CONTAINER_PORT:?POSTGRES_CONTAINER_PORT is required in .env}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required in .env}
      TZ: UTC
      PGTZ: UTC
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:${POSTGRES_CONTAINER_PORT:?POSTGRES_CONTAINER_PORT is required in .env}"
    volumes:
      - alertamujer_db_data:/var/lib/postgresql/data
      - ./docker/initdb/10-create-application-role.sh:/docker-entrypoint-initdb.d/10-create-application-role.sh:ro
    networks:
      - alertamujer_db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -p \"$$POSTGRES_CONTAINER_PORT\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  alertamujer_db_data:
    name: alertamujer_db_data

networks:
  alertamujer_db_network:
    name: alertamujer_db_network
